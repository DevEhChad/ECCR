<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="gradRing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3E7BFA"/>
      <stop offset="50%" stop-color="#00E599"/>
      <stop offset="100%" stop-color="#FF4D6D"/>
    </linearGradient>
    <linearGradient id="gradCore" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1A202E"/>
      <stop offset="100%" stop-color="#0E1118"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Steering Wheel Rim -->
  <circle cx="256" cy="256" r="220" fill="none" stroke="#161B26" stroke-width="38"/>
  <circle cx="256" cy="256" r="220" fill="none" stroke="url(#gradRing)" stroke-width="12" stroke-linecap="round" stroke-dasharray="280 40 180 40" filter="url(#glow)"/>

  <!-- Wheel Grips (Left / Right / Top Indicator) -->
  <rect x="244" y="16" width="24" height="40" rx="6" fill="#00E599" filter="url(#glow)"/>
  <rect x="18" y="210" width="38" height="92" rx="10" fill="#1F283C" stroke="#3E7BFA" stroke-width="3"/>
  <rect x="456" y="210" width="38" height="92" rx="10" fill="#1F283C" stroke="#FF4D6D" stroke-width="3"/>

  <!-- Center Gamepad Core Body -->
  <path d="M140 200 C140 150, 372 150, 372 200 C372 250, 390 340, 330 355 C290 365, 275 300, 256 300 C237 300, 222 365, 182 355 C122 340, 140 250, 140 200 Z" fill="url(#gradCore)" stroke="#2D374D" stroke-width="6"/>

  <!-- Left Side: D-Pad / Steering Cross -->
  <g transform="translate(180, 230)">
    <rect x="-8" y="-24" width="16" height="48" rx="4" fill="#2A3245" stroke="#3E7BFA" stroke-width="2"/>
    <rect x="-24" y="-8" width="48" height="16" rx="4" fill="#2A3245" stroke="#3E7BFA" stroke-width="2"/>
  </g>

  <!-- Right Side: PlayStation/Xbox Face Nodes -->
  <circle cx="332" cy="210" r="8" fill="#FF4D6D"/>
  <circle cx="312" cy="230" r="8" fill="#00A2FF"/>
  <circle cx="352" cy="230" r="8" fill="#FF66CC"/>
  <circle cx="332" cy="250" r="8" fill="#00E599"/>

  <!-- Branding Acronym Center Hub -->
  <circle cx="256" cy="230" r="28" fill="#0E1118" stroke="#3E7BFA" stroke-width="3"/>
  <text x="256" y="237" font-family="'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="14" fill="#FFFFFF" text-anchor="middle" letter-spacing="1">ECCR</text>

  <!-- Center Lower Nameplate -->
  <text x="256" y="420" font-family="'Segoe UI', Roboto, sans-serif" font-weight="800" font-size="20" fill="#BAC2DE" text-anchor="middle" letter-spacing="2">EHCHADS REMAPPER</text>
</svg>
